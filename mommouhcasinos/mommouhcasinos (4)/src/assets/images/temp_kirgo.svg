<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1218"/>
      <stop offset="100%" stop-color="#05080b"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fffe3"/>
      <stop offset="50%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#00e701"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#213743" stroke-width="4"/>

  <!-- Stylized K (Kirgo Emblem) -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <path d="M 130 110 L 205 110 L 205 402 L 130 402 Z" fill="url(#mintGrad)" rx="8" />
    
    <!-- Top diagonal arm -->
    <path d="M 205 266 L 332 110 L 398 110 L 260 278 Z" fill="url(#mintGrad)" />
    
    <!-- Bottom diagonal arm -->
    <path d="M 235 250 L 340 402 L 412 402 L 290 230 Z" fill="url(#mintGrad)" />
  </g>
</svg>