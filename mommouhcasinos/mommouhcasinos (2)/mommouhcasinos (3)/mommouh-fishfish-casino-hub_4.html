:root {
  --font-family-base: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-family-display: 'IBM Plex Sans', sans-serif;
}

html, body, :host {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* Headings: IBM Plex Sans 700-800 for major titles, 600-700 for section & casino titles */
h1, h2 {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 700;
  letter-spacing: -0.015em;
}

h3, h4 {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.font-display {
  font-family: 'IBM Plex Sans', sans-serif;
  letter-spacing: -0.01em;
}

/* Sidebar navigation, buttons & controls: 500-600 */
.btn, button, nav a, .nav-item {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 600;
  letter-spacing: 0.01em;
}

input, select, textarea, .field {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 500;
}

.chip {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 700;
}

/* Supporting text & badges: 400-500 */
p, span, li, label, .micro {
  font-family: 'IBM Plex Sans', sans-serif;
}

.micro {
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.font-mono {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
}

/* Enhanced Details & Ghost Button States */
.btn-ghost {
  background: rgba(47, 69, 83, 0.45) !important;
  color: #d2deed !important;
  border: 1px solid rgba(255, 255, 255, 0.1) !important;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1) !important;
  font-weight: 600 !important;
}

.btn-ghost:hover:not(:disabled),
.btn-ghost:focus-visible:not(:disabled) {
  background: rgba(47, 69, 83, 0.88) !important;
  color: #ffffff !important;
  border-color: rgba(0, 231, 1, 0.55) !important;
  box-shadow: 0 0 16px -2px rgba(0, 231, 1, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15) !important;
  transform: translateY(-1.5px) !important;
}

.btn-ghost:active:not(:disabled) {
  background: rgba(47, 69, 83, 1) !important;
  transform: translateY(0) !important;
}

/* Modal text refinements for maximum readability */
#casino-modal-title {
  color: #ffffff !important;
  font-weight: 700 !important;
}

.modal-desc-p {
  color: #d8e3f0 !important;
  font-size: 14.5px !important;
  line-height: 1.7 !important;
}

.modal-highlights-title {
  color: #ffffff !important;
  font-weight: 700 !important;
  letter-spacing: 0.05em !important;
  text-transform: uppercase !important;
}

.modal-highlight-item {
  color: #e2ecf7 !important;
  font-size: 14px !important;
  line-height: 1.55 !important;
  font-weight: 500 !important;
}

.modal-legal-text {
  color: #9fb3c8 !important;
  font-size: 12px !important;
  line-height: 1.6 !important;
}

/* Twitch icon hover styles */
.group:hover .group-hover\:text-\[\#9146FF\],
.group:hover .group-hover\:stroke-\[\#9146FF\],
a.group:hover svg.lucide-twitch,
a.group:hover .twitch-icon {
  color: #9146FF !important;
  stroke: #9146FF !important;
}
.group:hover .group-hover\:fill-\[\#9146FF\] {
  fill: #9146FF !important;
}
svg.lucide-twitch, .twitch-icon {
  transition: color 0.2s ease, stroke 0.2s ease !important;
}

/* =========================================================
   LUXURY LIGHTING, GLOW, SHIMMER & SPARKLE ENHANCEMENTS
   ========================================================= */

@keyframes ambient-glow-pulse-1 {
  0%, 100% {
    transform: translate(0, 0) scale(1);
    opacity: 0.12;
  }
  50% {
    transform: translate(4%, 3%) scale(1.08);
    opacity: 0.18;
  }
}

@keyframes ambient-glow-pulse-2 {
  0%, 100% {
    transform: translate(0, 0) scale(1);
    opacity: 0.05;
  }
  50% {
    transform: translate(-3%, -4%) scale(1.12);
    opacity: 0.09;
  }
}

@keyframes ambient-glow-pulse-3 {
  0%, 100% {
    transform: translate(0, 0) scale(1);
    opacity: 0.04;
  }
  50% {
    transform: translate(5%, -3%) scale(1.15);
    opacity: 0.08;
  }
}

@keyframes sparkle-twinkle {
  0%, 100% {
    opacity: 0;
    transform: translateY(0px) scale(0.6);
  }
  50% {
    opacity: 0.85;
    transform: translateY(-8px) scale(1.1);
    filter: drop-shadow(0 0 6px rgba(0, 231, 1, 0.8));
  }
}

@keyframes sparkle-twinkle-gold {
  0%, 100% {
    opacity: 0;
    transform: translateY(0px) scale(0.5);
  }
  50% {
    opacity: 0.9;
    transform: translateY(-12px) scale(1.15);
    filter: drop-shadow(0 0 8px rgba(36, 255, 38, 0.9));
  }
}

@keyframes sparkle-twinkle-blue {
  0%, 100% {
    opacity: 0;
    transform: translateY(0px) scale(0.5);
  }
  50% {
    opacity: 0.8;
    transform: translateY(-10px) scale(1.1);
    filter: drop-shadow(0 0 7px rgba(92, 127, 184, 0.85));
  }
}

.panel {
  position: relative;
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
  box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05), inset 0 0 18px -8px rgba(0, 231, 1, 0.02) !important;
}

.panel:hover {
  box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.65), 0 0 22px -6px rgba(0, 231, 1, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 28px -10px rgba(0, 231, 1, 0.06) !important;
}

article.panel {
  border: 1px solid rgba(47, 69, 83, 0.45);
}

article.panel:hover {
  border-color: rgba(0, 231, 1, 0.38) !important;
}

.shine {
  position: relative;
  overflow: hidden;
}

.shine::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(
    115deg,
    transparent 20%,
    rgba(255, 255, 255, 0.03) 38%,
    rgba(0, 231, 1, 0.09) 50%,
    rgba(255, 255, 255, 0.06) 54%,
    transparent 72%
  ) !important;
  background-size: 300% 100% !important;
  background-position: 200% 0 !important;
  transition: background-position 0.75s ease-out !important;
  z-index: 2;
}

.shine:hover::after {
  background-position: -60% 0 !important;
}

.panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 231, 1, 0.3), rgba(255, 255, 255, 0.35), rgba(0, 231, 1, 0.3), transparent);
  pointer-events: none;
  opacity: 0.6;
  transition: opacity 0.3s ease, left 0.3s ease, right 0.3s ease;
  z-index: 3;
}

.panel:hover::before {
  left: 4%;
  right: 4%;
  opacity: 1;
  background: linear-gradient(90deg, transparent, rgba(0, 231, 1, 0.6), rgba(255, 255, 255, 0.75), rgba(0, 231, 1, 0.6), transparent);
}

.hero-surface {
  background: radial-gradient(ellipse 90% 120% at 75% -20%, rgba(0, 231, 1, 0.12), transparent 60%),
              radial-gradient(ellipse 70% 80% at 15% 110%, rgba(20, 117, 225, 0.15), transparent 55%),
              linear-gradient(115deg, rgba(20, 117, 225, 0.2), rgba(0, 231, 1, 0.06) 55%, transparent 75%),
              var(--bg-panel) !important;
  box-shadow: 0 8px 30px -4px rgba(0, 0, 0, 0.55), 0 0 35px -8px rgba(0, 231, 1, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;
}

.felt {
  background: radial-gradient(ellipse 70% 60% at 50% 30%, rgba(0, 231, 1, 0.06), transparent 75%),
              radial-gradient(ellipse 80% 100% at 50% 0%, rgba(20, 117, 225, 0.14), transparent 65%),
              linear-gradient(180deg, #142c3c, #0f212e) !important;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 0 40px -10px rgba(0, 231, 1, 0.05) !important;
}

.btn-gold, button.btn-gold, a.btn-gold, [class*="bg-gradient-to-b from-[var(--gold-bright)]"] {
  position: relative;
  box-shadow: 0 2px 10px rgba(0, 231, 1, 0.22), 0 0 12px -2px rgba(0, 231, 1, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.35) !important;
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1) !important;
}

.btn-gold:hover, button.btn-gold:hover, a.btn-gold:hover, [class*="bg-gradient-to-b from-[var(--gold-bright)]"]:hover {
  box-shadow: 0 4px 22px rgba(0, 231, 1, 0.48), 0 0 18px rgba(36, 255, 38, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.55) !important;
  filter: brightness(1.04);
}

nav a, aside a {
  transition: all 0.2s ease !important;
}

nav a:hover, aside a:hover {
  text-shadow: 0 0 12px rgba(0, 231, 1, 0.4);
}

aside a[href*="twitch.tv"]:hover {
  box-shadow: 0 0 18px -2px rgba(145, 70, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
  border-color: rgba(145, 70, 255, 0.5) !important;
}

.promo-box, [class*="font-mono"][class*="text-[var(--gold)]"] {
  text-shadow: 0 0 10px rgba(0, 231, 1, 0.35);
}

.sparkle-node {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff 10%, rgba(36, 255, 38, 0.9) 50%, transparent 80%);
  animation: sparkle-twinkle 4.5s ease-in-out infinite;
  z-index: 1;
}

.sparkle-node.gold {
  background: radial-gradient(circle, #ffffff 15%, rgba(0, 231, 1, 0.95) 45%, transparent 80%);
  animation: sparkle-twinkle-gold 5.5s ease-in-out infinite;
}

.sparkle-node.blue {
  background: radial-gradient(circle, #ffffff 15%, rgba(130, 180, 255, 0.9) 45%, transparent 80%);
  animation: sparkle-twinkle-blue 6s ease-in-out infinite;
}

.ambient-light-orb-1 {
  animation: ambient-glow-pulse-1 12s ease-in-out infinite alternate;
}

.ambient-light-orb-2 {
  animation: ambient-glow-pulse-2 15s ease-in-out infinite alternate;
}

.ambient-light-orb-3 {
  animation: ambient-glow-pulse-3 18s ease-in-out infinite alternate;
}

@media (prefers-reduced-motion: reduce) {
  .sparkle-node,
  .ambient-light-orb-1,
